# PMM custom queries for the DuckDB secondary engine plugin (medium
# resolution, about every 10 s). Copy to the MySQL host:
#   /usr/local/percona/pmm/collectors/custom-queries/mysql/medium-resolution/
# Metric names: <query name>_<column>, for example
#   mysql_duckdb_tables_copy.
# The numeric duckdb_* status variables need nothing here: PMM already
# collects them as mysql_global_status_duckdb_* (and the variables as
# mysql_global_variables_duckdb_*), including the applier lag in seconds and
# bytes, the applier state code and DuckDB's memory (2026-11-20). These
# queries read only INFORMATION_SCHEMA and performance_schema tables that
# take no server-wide lock. See README.md.

# One series per DuckDB copy, with its state (LOADED, STALE, REFRESHING,
# REFRESH_PENDING) and history flag; the refresh rows while it refreshes.
# REFRESH_ROWS_* exist from the 2026-11-19 build (T0); with an older plugin
# use the variant at the end of README.md.
mysql_duckdb_tables:
  query: "SELECT TABLE_SCHEMA AS table_schema, TABLE_NAME AS table_name, STATE AS state, RETAIN_HISTORY AS retain_history, 1 AS copy, COALESCE(REFRESH_ROWS_DONE, 0) AS refresh_rows_done, COALESCE(REFRESH_ROWS_TOTAL, 0) AS refresh_rows_total FROM information_schema.DUCKDB_TABLES"
  metrics:
    - table_schema:
        usage: "LABEL"
        description: "Schema"
    - table_name:
        usage: "LABEL"
        description: "Table"
    - state:
        usage: "LABEL"
        description: "LOADED, STALE, REFRESHING, REFRESH_PENDING"
    - retain_history:
        usage: "LABEL"
        description: "YES for history copies"
    - copy:
        usage: "GAUGE"
        description: "Always 1: one series per copy"
    - refresh_rows_done:
        usage: "GAUGE"
        description: "Rows copied by the refresh in progress"
    - refresh_rows_total:
        usage: "GAUGE"
        description: "InnoDB's estimate of the rows of the refresh in progress"

# Loads and waits in progress, from the Performance Schema stages
# stage/duckdb/% (needs the instruments and the events_stages_current
# consumer enabled, README.md), aggregated by stage: one series per stage,
# never one per connection. No rows when nothing runs.
mysql_duckdb_stages:
  query: "SELECT SUBSTRING_INDEX(s.EVENT_NAME, '/', -1) AS stage, COUNT(*) AS running, COALESCE(SUM(s.WORK_COMPLETED), 0) AS work_completed, COALESCE(SUM(s.WORK_ESTIMATED), 0) AS work_estimated FROM performance_schema.events_stages_current s WHERE s.EVENT_NAME LIKE 'stage/duckdb/%' GROUP BY s.EVENT_NAME"
  metrics:
    - stage:
        usage: "LABEL"
        description: "copy load, waiting for copy refresh, waiting for applier"
    - running:
        usage: "GAUGE"
        description: "Connections in this stage"
    - work_completed:
        usage: "GAUGE"
        description: "Rows done (all connections in this stage)"
    - work_estimated:
        usage: "GAUGE"
        description: "Rows expected (all connections in this stage)"

# The last refusal as a reason code (the text before the first ':' or space:
# unsupported_function, decimal_overflow, duckdb_prepare ...), never its
# arguments (function or column names): a small, fixed set of series.
mysql_duckdb_last_refusal:
  query: "SELECT SUBSTRING_INDEX(SUBSTRING_INDEX(VARIABLE_VALUE, ':', 1), ' ', 1) AS reason, 1 AS info FROM performance_schema.global_status WHERE VARIABLE_NAME = 'duckdb_offload_last_refusal' AND VARIABLE_VALUE <> ''"
  metrics:
    - reason:
        usage: "LABEL"
        description: "Reason code of duckdb_offload_last_refusal"
    - info:
        usage: "GAUGE"
        description: "Always 1; the reason is the label"
